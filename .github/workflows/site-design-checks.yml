name: Website design checks

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint website
        run: npm run lint
      - name: Compile production website without deploying
        run: npm run build
      - name: Confirm static export (no request-time pages)
        run: |
          test -f out/index.html
          test -f out/lead-capture.html
          test -f out/lead-capture/thanks.html
          test -f out/classes.html
          test -f out/blog.html
          test -f out/free-lessons.html
          test -f out/auth/linkedin/callback.html

