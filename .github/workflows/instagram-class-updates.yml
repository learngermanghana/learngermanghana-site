name: Instagram Class Update Agent

on:
  push:
    branches:
      - main
      - master
    paths:
      - "src/data/content.ts"
      - "src/data/classesCatalog.ts"
      - "src/lib/classes.ts"
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Collect class changes
        id: changes
        shell: bash
        run: |
          BASE_COMMIT="${{ github.event.before }}"
          if [ -z "$BASE_COMMIT" ] || [ "$BASE_COMMIT" = "0000000000000000000000000000000000000000" ]; then
            BASE_COMMIT="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_COMMIT" HEAD -- src/data/content.ts src/data/classesCatalog.ts src/lib/classes.ts)

          if [ -z "$CHANGED_FILES" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "changed_files<<EOF"
            echo "$CHANGED_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          {
            echo "class_diff<<EOF"
            git diff --unified=0 "$BASE_COMMIT" HEAD -- src/data/content.ts src/data/classesCatalog.ts src/lib/classes.ts
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Generate and publish Instagram post
        if: steps.changes.outputs.has_changes == 'true'
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.changed_files }}
          CLASS_DIFF: ${{ steps.changes.outputs.class_diff }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_IG_USER_ID: ${{ secrets.INSTAGRAM_IG_USER_ID }}
          INSTAGRAM_IMAGE_URL: ${{ vars.INSTAGRAM_IMAGE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          REGISTER_URL: ${{ vars.REGISTER_URL }}
        run: node scripts/instagram-autopost.mjs
